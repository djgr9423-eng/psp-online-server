name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configuration
        run: python3 -m json.tool config.json >/dev/null
      - name: Build relay image
        run: docker build --tag psp-online-server:ci .
